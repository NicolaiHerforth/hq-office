id = "hq-office"
name = "HQ Office"
version = "0.21.0"
min_herdr_version = "0.8.0"
description = "A handheld-RPG office where every herdr agent lane is a worker, plus a panel where you answer your HQ agent's questions"
platforms = ["macos", "linux"]

# When an agent starts, the HQ agent's new session gets the HQ guide once: talk to the owner through the HUD.
[[events]]
on = "pane.agent_detected"
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts greet"]

[[actions]]
id = "start"
title = "HQ Office: start and open"
description = "Start the HQ Office server if it is not running, then open it in the browser"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts start"]

[[actions]]
id = "stop"
title = "HQ Office: stop"
description = "Stop the HQ Office server this plugin started (or its service, until the next login or start)"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts stop"]

[[actions]]
id = "reload"
title = "HQ Office: restart"
description = "Restart the server (rewriting its service, if installed), to pick up config.env changes"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts reload"]

[[actions]]
id = "open"
title = "HQ Office: open in browser"
description = "Open the HQ Office page without touching the server"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts open"]

[[actions]]
id = "install-service"
title = "HQ Office: install service"
description = "Run the server as a per-user service (launchd on macOS, systemd on Linux) that starts at login and restarts when it stops. Run again to update it"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts install-service"]

[[actions]]
id = "remove-service"
title = "HQ Office: remove service"
description = "Stop and remove the per-user service. Your data stays"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts remove-service"]

[[actions]]
id = "install-hud"
title = "HQ Office: install hud command"
description = "Put a hud command in ~/.local/bin that runs this plugin's hud.ts against this server. Run again to update it"
contexts = ["global", "workspace"]
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts install-hud"]

[[panes]]
id = "status"
title = "HQ Office: status"
description = "Whether the server is up, whether its service is installed and running, open questions, lanes by status, the HQ agent and the data directory"
placement = "popup"
command = ["sh", "-c", "PATH=\"$HOME/.bun/bin:$PATH\" exec bun bin/hud-plugin.ts status"]
