<!-- THE MONITOR's page: memory as one picture of tiles that you scrub through time, drawn from /api/monitor/page/*. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* The theme is the one the HUD is set to (MENU, THEME: its key, which this page only reads), and the screen's own
   when that says SYSTEM. A change made in the HUD shows here at once. */
(() => {
  const follow = () => {
    let t = null;
    try { t = localStorage.getItem("hq-theme"); } catch (e) { /* no storage here: the screen's own */ }
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  };
  follow();
  addEventListener("storage", (e) => { if (e.key === "hq-theme" || e.key === null) follow(); });
})();
</script>
<style>
:root{
  color-scheme:light;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --page:#f9f9f7;--surface:#fcfcfb;--sunken:#f1f0ec;--sel:#eae9e4;
  --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#898781;--hair:#e1e0d9;--axis:#c3c2b7;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --warn-wash:#fdf1cf;--crit-wash:#fbe6e6;--on-crit:#ffffff;--on-warn:#0b0b0b;--on-good:#ffffff;
  --vessel:#7d7b76;--tip:#0b0b0b;--tip-ink:#f0efec;--tip-ink-2:#b5b4ab;--tip-hair:#383835;
  --s1:#2b7ad6;--s2:#059488;--s3:#7447c8;--s4:#20a04e;--s5:#1795bb;--s6:#7f9120;--s7:#ae4090;
  --on-s1:#ffffff;--on-s2:#0b0b0b;--on-s3:#ffffff;--on-s4:#0b0b0b;--on-s5:#0b0b0b;--on-s6:#0b0b0b;--on-s7:#ffffff;
  --n-lanes-0:#aaa49f;--n-lanes-1:#959089;--n-apps-0:#d3cfc8;--n-apps-1:#c2bdb5;--n-system-0:#6b7482;--n-system-1:#8b9099;
  --on-n-lanes-0:#0b0b0b;--on-n-lanes-1:#0b0b0b;--on-n-apps-0:#0b0b0b;--on-n-apps-1:#0b0b0b;--on-n-system-0:#ffffff;--on-n-system-1:#0b0b0b;
  --tile-mix:100%;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--sunken:#121211;--sel:#2c2c2a;
  --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#898781;--hair:#2c2c2a;--axis:#3d3d3a;
  --warn-wash:#3b2f0c;--crit-wash:#3a1717;
  --vessel:#a09e97;--tip:#2a2a28;--tip-ink:#f0efec;--tip-ink-2:#b5b4ab;--tip-hair:#45453f;
  --s1:#3986e4;--s2:#179a8e;--s3:#8a66d9;--s4:#2aa654;--s5:#1aa1c9;--s6:#8b9d26;--s7:#bf50a0;
  --on-s1:#ffffff;--on-s2:#0b0b0b;--on-s3:#ffffff;--on-s4:#0b0b0b;--on-s5:#0b0b0b;--on-s6:#0b0b0b;--on-s7:#ffffff;
  --n-lanes-0:#7d7873;--n-lanes-1:#68635e;--n-apps-0:#57534d;--n-apps-1:#46433e;--n-system-0:#56606e;--n-system-1:#3f444c;
  --on-n-lanes-0:#ffffff;--on-n-lanes-1:#ffffff;--on-n-apps-0:#ffffff;--on-n-apps-1:#ffffff;--on-n-system-0:#ffffff;--on-n-system-1:#ffffff;
  --tile-mix:88%;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--sunken:#121211;--sel:#2c2c2a;
  --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#898781;--hair:#2c2c2a;--axis:#3d3d3a;
  --warn-wash:#3b2f0c;--crit-wash:#3a1717;
  --vessel:#a09e97;--tip:#2a2a28;--tip-ink:#f0efec;--tip-ink-2:#b5b4ab;--tip-hair:#45453f;
  --s1:#3986e4;--s2:#179a8e;--s3:#8a66d9;--s4:#2aa654;--s5:#1aa1c9;--s6:#8b9d26;--s7:#bf50a0;
  --on-s1:#ffffff;--on-s2:#0b0b0b;--on-s3:#ffffff;--on-s4:#0b0b0b;--on-s5:#0b0b0b;--on-s6:#0b0b0b;--on-s7:#ffffff;
  --n-lanes-0:#7d7873;--n-lanes-1:#68635e;--n-apps-0:#57534d;--n-apps-1:#46433e;--n-system-0:#56606e;--n-system-1:#3f444c;
  --on-n-lanes-0:#ffffff;--on-n-lanes-1:#ffffff;--on-n-apps-0:#ffffff;--on-n-apps-1:#ffffff;--on-n-system-0:#ffffff;--on-n-system-1:#ffffff;
  --tile-mix:88%;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);letter-spacing:-.02em;word-spacing:-.3em;font-feature-settings:"zero" 0}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.app{max-width:1440px;margin:0 auto;padding:8px 24px 48px}

.top{display:flex;align-items:center;gap:20px;height:24px;font-size:12px;color:var(--ink-3)}
.brand{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.brand b{color:var(--ink);font-weight:600;letter-spacing:-.01em}
.brand svg{display:block}
.home{display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;margin:-10px 0 -10px -6px;padding:0 6px;color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.home:hover{color:var(--ink)}
.meta{flex:1;display:flex;gap:18px;justify-content:flex-end;min-width:0}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span:last-child{flex:none}
.live{display:inline-flex;align-items:center;gap:5px;padding:1px 10px 1px 5px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink);border:1px solid var(--axis);background:var(--surface);white-space:nowrap}
.live svg{display:block}
.live[data-s="1"]{background:var(--warn-wash);border-color:transparent}
.live[data-s="2"]{background:var(--crit);color:var(--on-crit);border-color:transparent;--ico-bg:var(--on-crit);--ico-fg:var(--crit)}
.tl-head .live{display:none}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;padding:2px;gap:2px;background:var(--surface)}
.seg button{padding:3px 10px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}

.stale{display:flex;align-items:flex-start;gap:8px;margin:6px 0 2px;padding:7px 12px;border-radius:8px;background:var(--warn-wash);color:var(--ink);font-size:13px;line-height:1.4}
.stale span:first-child{flex:none;margin-top:2px}
.gate{max-width:760px;padding:28px 0 80px}
.app.ready>.gate,.app:not(.ready)>:is(.verdict,.model,.time,.lower,.foot){display:none}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:24px;min-height:118px;margin:4px 0 8px}
.viewing{font-weight:600;color:var(--ink)}
.pillrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);height:26px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px 2px 6px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink);border:1px solid var(--hair);white-space:nowrap}
.pill svg{display:block}
.pill[data-s="1"]{background:var(--warn-wash);border-color:transparent}
.pill[data-s="2"]{background:var(--crit);color:var(--on-crit);border-color:transparent;--ico-bg:var(--on-crit);--ico-fg:var(--crit)}
.pill[data-s="gap"]{background:var(--sunken);color:var(--ink-2)}
#pillmeta{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.by{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.by svg{display:block}
.headline{font-size:27px;line-height:1.16;font-weight:600;letter-spacing:-.022em;margin:7px 0 5px;text-wrap:balance}
.sentence{font-size:14.5px;line-height:1.42;color:var(--ink-2);max-width:940px;margin:0}
.hn{white-space:nowrap;color:var(--ink);font-weight:500}
.hn .sw{margin-right:5px;transform:translateY(-.5px)}
.context{font-size:12.5px;line-height:1.38;color:var(--ink-3);margin:3px 0 0}
.moment{align-self:start;border-left:1px solid var(--hair);padding:2px 0 2px 18px;margin-top:2px}
.moment .lab{font-size:11.5px;color:var(--ink-3)}
.moment .when{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin-top:1px}
.moment .sub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-top:1px}
.moment .fresh{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sel)}
.btn[disabled]{color:var(--ink-3);cursor:default;background:none;font-weight:500}
.btn svg{display:block}

.panel{background:var(--surface);border:1px solid var(--hair);border-radius:12px}
.model{display:grid;grid-template-columns:minmax(0,1fr) 428px}
.mapcol{position:relative;padding:8px 14px 10px 16px;min-width:0}
.maphead{display:flex;align-items:center;justify-content:flex-end;gap:16px;height:36px;margin-bottom:2px}
.toggles{display:flex;gap:8px;flex:none}
.info{font-family:var(--mono);font-size:12px;font-weight:600;font-style:italic;color:var(--ink-2)}
.info[aria-expanded="true"]{background:var(--sel);color:var(--ink)}
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--axis);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.pop h4{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink)}
.pop p{margin:0 0 8px}
#info{right:14px;top:46px;width:440px;max-width:calc(100% - 28px)}
#info h4:not(:first-child){margin-top:10px}
#info .states div{margin-top:6px}
#info .states b{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.mapwrap{position:relative;display:grid;grid-template-columns:108px minmax(0,1fr) 54px;align-items:start;min-height:var(--map-h,360px)}
.gutter,.ruler{position:relative}
.gutter,.stage,.ruler{grid-row:1;height:var(--map-h,360px)}
.gutter{grid-column:1}.stage{grid-column:2}.ruler{grid-column:3}
.tabled>.gutter,.tabled>.stage,.tabled>.ruler{visibility:hidden}
.rg{position:absolute;left:0;right:12px;font-size:12px;line-height:1.25;transition:top .24s cubic-bezier(.2,.7,.2,1)}
.rg .rgn{font-weight:600;display:flex;gap:6px;align-items:flex-start}
.rg .rgn svg{flex:none;margin-top:2px}
.rg .rgv{color:var(--ink-2);font-size:11.5px;margin-left:16px;font-family:var(--sans);letter-spacing:0;word-spacing:0;font-variant-numeric:tabular-nums}
.rgb{position:absolute;right:4px;width:2px;border-radius:1px;background:var(--axis);transition:top .24s cubic-bezier(.2,.7,.2,1),height .24s cubic-bezier(.2,.7,.2,1)}
.stage{position:relative}
.ram{position:absolute;left:0;right:0;bottom:0;border:1px solid var(--ink-3);border-top:0;border-radius:0 0 5px 5px;pointer-events:none;z-index:1}
.brim{position:absolute;left:-6px;right:-6px;height:2px;background:var(--ink);z-index:4;pointer-events:none;border-radius:1px}
.capped:not(.bycpu) .brim{background:var(--crit)}
.capped.bycpu #cap2{background:var(--crit);height:2px;margin-top:-1px}
.capline{position:absolute;left:0;right:0;height:1px;background:var(--ink-2);z-index:4;pointer-events:none}
.spill{position:absolute;left:1px;right:1px;z-index:3;pointer-events:none;background-color:color-mix(in srgb,var(--crit) 14%,transparent);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--crit) 75%,transparent) 0 2px,transparent 2px 7px);border-top:2px solid var(--crit);opacity:0;transition:opacity .2s}
.capped.over .spill{opacity:1}
.zonecap{position:absolute;left:0;right:0;top:0;min-height:20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);z-index:5;pointer-events:none;white-space:nowrap}
.zonecap b{font-weight:600;color:var(--ink);white-space:nowrap}
.zonecap .more{margin-left:-4px}
.spillmsg{display:inline-flex;align-items:center;gap:6px;background:var(--crit);color:var(--on-crit);font-weight:600;border-radius:5px;padding:1px 9px 1px 6px;font-size:12px;--ico-bg:var(--on-crit);--ico-fg:var(--crit)}
.headroom{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink-3);z-index:1;pointer-events:none;transform:translateY(-50%);transition:top .24s cubic-bezier(.2,.7,.2,1);white-space:nowrap}
.tile{position:absolute;left:0;top:0;border-radius:3px;background:color-mix(in srgb,var(--c) var(--tile-mix),var(--surface));color:var(--on);overflow:hidden;cursor:pointer;
  transition:left .24s cubic-bezier(.2,.7,.2,1),top .24s cubic-bezier(.2,.7,.2,1),width .24s cubic-bezier(.2,.7,.2,1),height .24s cubic-bezier(.2,.7,.2,1),opacity .2s,filter .12s}
.scrub .tile,.scrub .rg,.scrub .rgb,.scrub .headroom,.scrub .lvl{transition-duration:.1s}
.playing .tile,.playing .rg,.playing .rgb,.playing .headroom,.playing .lvl,.playing .cseg{transition:none}
.tile.nil{opacity:0;pointer-events:none}
.tile:hover{filter:brightness(1.07) saturate(1.05)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:5;border-radius:3px}
.gapped .tile:not(.nil){opacity:.22}
.inst.gapped .vessel,.inst.gapped .cpu,.inst.gapped .disk{opacity:.3}
.tl{position:relative;z-index:5;padding:7px 9px;white-space:nowrap;pointer-events:none}
.tn{font-size:13px;line-height:16px;font-weight:600;letter-spacing:-.005em}
.tv{font-family:var(--mono);font-size:12px;line-height:16px;letter-spacing:-.02em;word-spacing:-.3em;display:flex;gap:8px;align-items:baseline}
.td{font-size:11px;line-height:15px;margin-top:3px;opacity:.82;font-weight:500}
.tvs{font-size:11px;opacity:.72}
.tk{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:-.04em;pointer-events:none}
[data-fit="s"]>.tl{padding:4px 6px}
[data-fit="s"] .tn{font-size:11px;line-height:13px}
[data-fit="s"] .tv{font-size:11px;line-height:14px}
[data-fit="s"] .tvs,[data-fit="i"] .tvs,[data-fit="n"] .tvs{display:none}
[data-fit="i"]>.tl{padding:0 8px;display:flex;gap:8px;align-items:center;height:100%;max-height:26px}
[data-fit="i"] .tn{font-size:12px;line-height:14px}
[data-fit="i"] .tv{line-height:14px}
[data-fit="n"]>.tl{padding:2px 3px}
[data-fit="n"] .tn{font-size:10.5px;line-height:12px}
[data-fit="j"]>.tl{padding:0 6px;display:flex;gap:6px;align-items:center;height:100%}
[data-fit="j"] .tn{font-size:10.5px;line-height:11px}
[data-fit="j"] .tv{font-size:10.5px;line-height:11px}
[data-fit="j"] .tvs{display:none}
[data-fit="c"]>.tl{padding:2px 4px}
[data-fit="c"] .tn{font-size:10.5px;line-height:12px;overflow:hidden;text-overflow:ellipsis}
[data-fit="n"] .tv,[data-fit="c"] .tv,[data-fit="k"]>.tl{display:none}
[data-fit="k"]>.tk{display:flex}
.rtick{position:absolute;left:0;right:0;font-size:11px;color:var(--ink-3);padding-left:12px;transform:translateY(-50%);white-space:nowrap;line-height:1.15}
.rtick::before{content:"";position:absolute;left:0;top:50%;width:7px;height:1px;background:var(--axis)}
.rtick.strong{color:var(--ink);font-weight:600}
.rtick.strong::before{background:var(--ink);height:2px;margin-top:-1px}
.rtick small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3)}
.mapkey{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;min-height:20px;margin:8px 0 0 108px;font-size:12px;color:var(--ink-2)}
.mapkey .kh{color:var(--ink-3);font-size:11.5px}
.kg{display:none}
.mk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:4px;padding:0 2px}
.mk:hover{color:var(--ink);background:var(--sel)}
.mk .kn{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:-.04em;min-width:17px;height:15px;line-height:13px;text-align:center;border:1px solid var(--axis);border-radius:3px;color:var(--ink)}
.mk .kv{font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em;word-spacing:-.3em;color:var(--ink-3)}
.tablev{grid-row:1;grid-column:1/-1;position:relative;min-height:var(--map-h,360px);background:var(--surface);z-index:7;overflow-x:auto}
table.t tr:focus-visible{outline-offset:-2px}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th{font-weight:500;color:var(--ink-3);text-align:right;padding:3px 10px;border-bottom:1px solid var(--hair);font-size:11.5px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:2px 10px;text-align:right;border-bottom:1px solid var(--hair);font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;word-spacing:-.3em;white-space:nowrap}
table.t td:first-child{font-family:var(--sans);letter-spacing:0;word-spacing:0;font-weight:500}
table.t td:first-child .sw{margin-right:8px}
table.t tr.grp td{font-family:var(--sans);font-weight:600;color:var(--ink-2);font-size:11.5px;padding-top:6px;letter-spacing:0;word-spacing:0}
table.t tr.tot td{font-weight:600;border-bottom:0}

.dive{position:absolute;inset:0;z-index:8;background:var(--surface);transform-origin:0 0;transition:transform .28s cubic-bezier(.2,.8,.2,1),background-color .28s;display:flex;flex-direction:column;border-radius:4px;overflow:hidden}
.dive.opening{background:var(--dc)}
.dived .ruler,.dived .gutter,.dived .zonecap,.dived .brim{visibility:hidden}
.dhead,.dnote,.dhist{transition:opacity .18s .12s}
.dive.opening .dhead,.dive.opening .dnote,.dive.opening .dhist{opacity:0;transition:none}
.dhead{display:flex;align-items:center;gap:14px;height:34px;flex:none;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;min-width:0}
.crumb button{color:var(--ink-2);font-weight:500;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
.crumb button:hover{color:var(--ink)}
.crumb .slash{color:var(--ink-3);font-weight:400}
.crumb .here{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dstat{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;min-width:0}
.dstat b{color:var(--ink);font-weight:600}
.dhead .btn{margin-left:auto;margin-right:3px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--hair);border-radius:4px;padding:0 4px;color:var(--ink-3);font-weight:500}
.dnote{font-size:12px;color:var(--ink-3);margin:0 0 6px;flex:none}
.dtiles{position:relative;flex:1;min-height:0}
.dtiles .tile{cursor:default;transition:none}
.dtiles .tile:hover{filter:none}
.dhist{flex:none;height:92px;padding-top:8px;position:relative}
.dhist .cap{font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.dhist .cap span:first-child{flex:none}
.dhist .cap span:last-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dhist svg{display:block;width:100%;height:66px;margin-top:2px;cursor:crosshair;touch-action:pan-y;overflow:visible}
.dhist text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}

.inst{border-left:1px solid var(--hair);padding:10px 16px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#g-disk{position:relative}
.tanks{display:grid;grid-template-columns:78px 90px minmax(0,1fr) 68px;gap:8px}
.gauge{min-width:0;border-radius:4px}
.g-t{font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.g-t svg{display:block;flex:none}
.g-v{font-family:var(--mono);word-spacing:-.3em;font-size:17px;font-weight:500;letter-spacing:-.04em;line-height:1.3;margin-top:1px;white-space:nowrap}
.g-v.word{font-family:var(--sans);word-spacing:0;font-weight:600;letter-spacing:-.015em;font-size:16px;line-height:22px}
.g-v small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-2);letter-spacing:-.02em;margin-left:5px}
.g-s{font-size:11.5px;color:var(--ink-2);line-height:15px;height:30px}
.g-s .amt,#heat-s{white-space:nowrap}
.g-s .tr{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.g-s .tr svg{display:block}
.vessel{position:relative;height:92px;margin-top:6px}
.vbox{position:absolute;left:0;bottom:0;width:34px;height:100%;border:1px solid var(--ink-3);border-top:0;border-radius:0 0 4px 4px}
.vtop{position:absolute;left:-3px;width:40px;top:0;height:2px;background:var(--ink);border-radius:1px}
.lvl{position:absolute;left:2px;bottom:2px;width:28px;border-radius:2px;background:var(--vessel);transition:height .24s cubic-bezier(.2,.7,.2,1),background-color .2s}
.lvl[data-s="1"]{background:var(--warn)}
.lvl[data-s="2"]{background:var(--crit)}
.vline{position:absolute;left:0;width:40px;height:1px;background:var(--ink-2);box-sizing:content-box;padding:4px 0;margin-top:-4px;background-clip:content-box}
.vlab{position:absolute;left:45px;font-size:10.5px;color:var(--ink-3);transform:translateY(-50%);white-space:nowrap;line-height:1}
#g-heat .vbox{width:22px;border:0;display:flex;flex-direction:column-reverse;gap:2px}
#g-heat .vtop{width:28px}
#g-heat .vline{width:28px}
#g-heat .vlab{left:32px}
.steps{position:absolute;left:45px;top:0;bottom:0;display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:10.5px;line-height:1;color:var(--ink-3);white-space:nowrap}
.steps span{display:flex;align-items:center;gap:4px}
.steps i{width:7px;height:7px;border-radius:50%;border:1px solid var(--axis);flex:none}
.steps .on{color:var(--ink);font-weight:600}
.steps .on i{background:var(--vessel);border-color:transparent}
.steps .on[data-s="1"] i{background:var(--warn)}
.steps .on[data-s="2"] i{background:var(--crit)}
.rate{position:relative;height:4px;margin-top:5px;border-radius:2px;background:var(--sunken)}
.rate i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--vessel)}
.rate[data-s="1"] i{background:var(--warn)}
.rate[data-s="2"] i{background:var(--crit)}
.rate b{position:absolute;top:-3px;width:1px;height:10px;background:var(--ink-2);box-sizing:content-box;padding:0 4px;margin-left:-4px;background-clip:content-box}
.hc{flex:1;border-radius:2px;background:var(--sunken);border:1px solid var(--axis)}
.hc.on{background:var(--vessel);border-color:transparent}
.hc.on[data-s="1"]{background:var(--warn)}
.hc.on[data-s="2"]{background:var(--crit)}
.sq{position:absolute;left:0;bottom:0}
.sq-out{border:1px solid var(--ink-3);border-radius:3px;transition:width .24s,height .24s}
.sq-in{left:2px;bottom:2px;background:var(--vessel);border-radius:2px;transition:width .24s,height .24s}
.rowg{border-top:1px solid var(--hair);margin-top:10px;padding-top:8px}
.rowg .hd{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.rowg .hd .g-t{align-self:center}
.rowg .hd .g-v{font-family:var(--sans);word-spacing:0;letter-spacing:-.005em;font-size:13px;font-weight:500;color:var(--ink-2);margin:0}
.rowg .hd .g-v b{font-weight:600;color:var(--ink)}
.cpu{position:relative;height:18px;margin:19px 0 15px;background:var(--sunken);border-radius:3px}
.cseg{position:absolute;top:0;height:100%;background:var(--c);transition:left .24s,width .24s}
.ccell{position:absolute;top:0;width:2px;height:100%;background:var(--surface);z-index:2}
.cline{position:absolute;top:-4px;width:1px;height:26px;background:var(--ink-2);z-index:3;box-sizing:content-box;padding:0 4px;margin-left:-4px;background-clip:content-box}
.clab{position:absolute;top:-15px;font-size:10.5px;color:var(--ink-3);transform:translateX(-100%);white-space:nowrap;padding-right:4px;line-height:1}
.clab.lo{top:auto;bottom:-15px}
.disk{position:relative;height:10px;margin-top:8px;background:var(--sunken);border-radius:3px}
.disk .lvl{left:0;bottom:0;height:100%;width:auto;border-radius:3px 0 0 3px;transition:width .24s}
.disk .cline{top:-3px;height:16px}
.diskfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.growers{left:-9px;right:-9px;bottom:34px}
.growers p{font-size:11.5px;color:var(--ink-3)}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:5px 0;border-top:1px solid var(--hair)}
.gr .nm{display:flex;align-items:center;gap:7px;min-width:0}
.gr .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--c)}
.gr .up{color:var(--ink-3);font-size:11.5px}

.time{margin-top:10px;padding:8px 16px 8px}
.tl-head{display:flex;align-items:center;gap:12px;height:30px}
.transport{display:flex;align-items:center;gap:4px}
.ibtn{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hair);background:var(--surface)}
.ibtn:hover{background:var(--sel)}
.ibtn.play{width:auto;padding:0 10px 0 8px;gap:6px;font-size:12px;font-weight:600}
.tl-read{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.tl-read b{color:var(--ink);font-weight:600}
.tl-read .st{display:inline-flex;align-items:center;gap:4px}
.hint{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.legend{display:flex;align-items:center;gap:4px 13px;flex-wrap:wrap;min-height:24px;margin-top:5px;font-size:12px}
.lg-g{color:var(--ink-3);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;margin-right:-3px}
.lg-g:not(:first-child){margin-left:8px;padding-left:14px;border-left:1px solid var(--hair)}
.lg{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);border-radius:4px;padding:1px 2px;white-space:nowrap}
.lg.sep{margin-left:8px;padding-left:14px;border-left:1px solid var(--hair);border-radius:0}
button.lg:hover,.lg[aria-pressed="true"]{color:var(--ink)}
.lg[aria-pressed="true"]{font-weight:600;background:var(--sel)}
.lg .v{display:none;font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em;word-spacing:-.3em;color:var(--ink-2);margin-left:auto}
.began{font-size:11.5px;color:var(--ink-3);margin:6px 0 0}
.plot{position:relative;height:calc(var(--sh,90px) + 60px);margin-top:4px;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;border-radius:4px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.plot text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.layer{stroke:var(--surface);stroke-width:2;stroke-linejoin:round;transition:opacity .2s}
.dim .layer{opacity:.16}
.dim .layer.on{opacity:1}
.pin{position:absolute;top:0;width:24px;height:20px;margin-left:-12px;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pin i{width:11px;height:11px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--surface);transition:transform .15s}
.pin:hover i,.pin[aria-pressed="true"] i{transform:scale(1.35)}
.pin::after{content:"";position:absolute;top:16px;left:11.5px;width:1px;height:calc(var(--sh,90px) + 4px);background:var(--crit);opacity:.35;pointer-events:none}
.ph{position:absolute;top:14px;left:0;width:0;height:calc(var(--sh,90px) + 24px);z-index:4;pointer-events:none;will-change:transform}
.ph::before{content:"";position:absolute;left:-1px;top:0;width:2px;height:100%;background:var(--ink);border-radius:1px}
.ph::after{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.phl{position:absolute;top:calc(var(--sh,90px) + 41px);left:0;z-index:5;pointer-events:none;background:var(--ink);color:var(--surface);font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:-.02em;line-height:18px;padding:0 7px 0 6px;border-radius:5px;white-space:nowrap;display:flex;align-items:center;gap:5px;will-change:transform}
.phl::before{content:"";width:6px;height:8px;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;opacity:.6}
.hv{position:absolute;top:14px;left:0;width:1px;height:calc(var(--sh,90px) + 24px);background:var(--ink-3);z-index:2;pointer-events:none}
.tl-foot{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.key{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.key svg{display:block}
.key i{display:inline-block;width:14px;height:6px;border-radius:1px}

.q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;margin-top:8px;min-height:174px}
.calwrap h4,.daybox h4{margin:0;font-size:12px;font-weight:600}
.calgrid{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,18px);grid-auto-columns:18px;gap:2px;margin-top:4px}
.calgrid .wd,.calgrid .mo{font-size:10.5px;color:var(--ink-3);line-height:18px;white-space:nowrap}
.calgrid .wd{padding-right:6px;width:30px}
.calgrid .mo{line-height:12px;overflow:visible;width:18px}
.cd{position:relative;width:18px;height:18px;border-radius:4px;background:var(--sunken);border:0}
.cd[data-s="1"]{background:linear-gradient(to top,var(--warn) 0 50%,var(--sunken) 50% 100%)}
.cd[data-s="2"]{background:var(--crit)}
.cd[data-s="n"]{background:none;border:1px solid var(--hair);cursor:default}
.cd:not([data-s="n"]):hover{outline:2px solid var(--ink-3);outline-offset:1px}
.cd[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.cd.today::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.cd.today[data-s="2"]::after{background:var(--on-crit)}
.cd .dn{display:none;font-family:var(--mono);letter-spacing:-.04em}
.cd[data-s="2"]{color:var(--on-crit)}
i.cd{display:inline-block;width:12px;height:12px;border-radius:3px}
.daybox{min-width:0;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1.5fr) minmax(0,1fr);gap:8px 32px;align-content:start;border-left:1px solid var(--hair);padding-left:28px}
.dayhead .d{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.dayhead .s{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:3px;flex-wrap:wrap}
.dayhead .s b{color:var(--ink);font-weight:600}
.dayhead p{font-size:12px;color:var(--ink-3);margin:8px 0 0;line-height:1.4}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:row dense;gap:0 18px;align-content:start}
.fig{border-top:1px solid var(--hair);padding:5px 0 7px;min-width:0}
.fig.wide{grid-column:span 2}
.fig .l{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .v{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.fig .v small{font-size:11.5px;font-weight:400;color:var(--ink-2);margin-left:3px}
.tops h4{color:var(--ink-3);font-weight:500;font-size:11.5px;border-top:1px solid var(--hair);padding-top:5px}
.tops h4:not(:first-child){margin-top:6px}
.toprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:4px 0 3px;font-size:12.5px}
.toprow .nm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:500}
.toprow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toprow .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--c)}

.lower{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;margin-top:26px}
.lower h2{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0 0 2px}
.lower .lede{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
.none{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink-2);background:var(--surface);max-width:560px}
.none b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.wm{display:grid;grid-template-columns:96px minmax(0,1fr) 26px;gap:2px 14px;align-items:center;width:100%;padding:9px 8px 9px 10px;border-top:1px solid var(--hair);border-radius:0}
.wm:last-of-type{border-bottom:1px solid var(--hair)}
.wm:hover{background:var(--surface)}
.wm[aria-pressed="true"]{background:var(--surface);box-shadow:inset 2px 0 0 var(--crit)}
.wm .d{font-size:12.5px;font-weight:600;white-space:nowrap;align-self:start}
.wm .d small{display:block;font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink);letter-spacing:-.02em;margin-top:1px}
.wm .h{display:block;font-size:13.5px;font-weight:500;line-height:1.3}
.wm .x{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;flex-wrap:wrap;gap:3px 12px;margin-top:5px;font-variant-numeric:tabular-nums}
.wm .x span{white-space:nowrap}
.go{width:24px;height:24px;border-radius:50%;border:1px solid var(--hair);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;transition:transform .15s,background-color .15s,color .15s}
.go svg{display:block}
.wm:hover .go,.patgo:hover .go{background:var(--ink);border-color:var(--ink);color:var(--surface);transform:translateX(2px)}
.mini{position:relative;width:124px;height:8px;flex:none;background:var(--sunken);border-radius:2px}
.mini i{position:absolute;top:0;height:100%;background:var(--c)}
.mini .cap{position:absolute;top:-3px;width:1.5px;height:14px;background:var(--ink)}
.btn.more{margin-top:10px}
.pats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.pat{border-top:1px solid var(--hair);padding:11px 0 10px;display:flex;flex-direction:column;min-width:0}
.pat h3{margin:0;font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.005em;display:flex;gap:8px;align-items:baseline}
.pat h3 .sw{transform:translateY(-1px)}
.pat p{margin:3px 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.pat svg{display:block;overflow:visible;max-width:100%;height:auto}
.pat svg rect[data-tip]:hover,.pat svg rect[data-tip]:focus-visible{fill:color-mix(in srgb,var(--ink) 9%,transparent);outline:none}
.pat svg text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.patgo{display:inline-flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px;font-size:12.5px;font-weight:600;align-self:flex-start;border-radius:6px}
.patgo span:first-child{text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
.patgo:hover span:first-child{text-decoration-color:var(--ink)}
.segbar{display:flex;gap:2px;height:28px;width:300px;max-width:100%}
.segbar div{border-radius:4px;display:flex;align-items:center;padding-left:8px;font-family:var(--mono);font-size:12px;font-weight:500;min-width:0}
.seglab{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11px;color:var(--ink-3);margin-top:5px}
.foot{margin-top:34px;border-top:1px solid var(--hair);padding-top:12px;color:var(--ink-3);font-size:12px}
.foot p{margin:0;max-width:880px}

.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--tip);color:var(--tip-ink);border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.4;max-width:330px;min-width:150px}
.tip .th{font-weight:600;display:flex;align-items:center;gap:7px;font-size:12.5px}
.tip .tm{color:var(--tip-ink-2);margin-top:1px}
.tip .tg{display:grid;grid-template-columns:auto auto;gap:1px 14px;margin-top:6px;padding-top:6px;border-top:1px solid var(--tip-hair)}
.tip .tg span:nth-child(odd){color:var(--tip-ink-2);display:flex;align-items:center;gap:6px}
.tip .tg span:nth-child(even){font-family:var(--mono);letter-spacing:-.02em;word-spacing:-.3em;text-align:right;font-weight:500}
.tip .lk{width:10px;height:3px;border-radius:1px;background:var(--c);flex:none}
.tip .ta{color:var(--tip-ink-2);margin-top:6px;padding-top:6px;border-top:1px solid var(--tip-hair)}
.tip pre{margin:0;font:inherit;white-space:pre-wrap}

@media (max-width:1180px){
  .model{grid-template-columns:minmax(0,1fr)}
  .inst{border-left:0;border-top:1px solid var(--hair)}
  .tanks{grid-template-columns:110px 120px 150px 80px;gap:28px}
  .hint{display:none}
  .meta span:first-child{display:none}
  .daybox{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
  .tops{grid-column:1/-1}
}
@media (max-width:760px){
  html{overflow-anchor:none}
  .app{padding:8px 16px 40px;display:flex;flex-direction:column}
  .top{gap:10px}
  .top .live,.meta{display:none}
  .verdict{grid-template-columns:minmax(0,1fr);gap:8px;min-height:0;margin:8px 0 12px;align-content:start}
  .pillrow{flex-wrap:wrap;height:auto;gap:4px 10px;white-space:normal}
  .headline{font-size:21px;line-height:1.2;margin:8px 0 6px}
  .sentence{font-size:14px}
  .context{font-size:12px;margin-top:6px}
  /* The moment and the way back to now are in the bar with the strip. */
  .moment{display:none}
  .model,.inst,.maphead,.time{display:contents}
  .mapcol{order:2;padding:10px 10px 12px 12px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;display:flex;flex-direction:column}
  .toggles{order:1;display:flex;gap:8px;margin-bottom:8px}
  .toggles .info{margin-left:auto}
  #info{left:10px;right:10px;top:64px;width:auto;max-width:none}
  .mapwrap{order:2;grid-template-columns:minmax(0,1fr) 40px;--map-h:470px;margin-top:8px}
  .gutter{display:none}
  .stage{grid-column:1}.ruler{grid-column:2}
  .mapkey{order:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin:12px 0 0;align-items:start}
  .mapkey .kh{display:none}
  .kg{display:flex;grid-column:1/-1;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-top:6px;padding-top:6px;border-top:1px solid var(--hair)}
  .kg:first-of-type{margin-top:0}
  .kg b{font-weight:600;color:var(--ink)}
  .kg .num{margin-left:auto}
  /* A row of the key is a name with its amount under it. Beside the name, the amount took the name's room and the
     name broke inside a word. */
  .mk{display:grid;grid-template-columns:19px 9px minmax(64px,1fr);gap:0 5px;align-content:center;align-items:start;white-space:normal;line-height:1.25;padding:2px 0;min-width:0}
  .mk .sw{margin-top:3.5px}
  .mk .kname{overflow-wrap:break-word}
  .mk .kv{grid-column:3}
  table.t th:nth-child(n+4),table.t td:nth-child(n+4){display:none}
  table.t td{padding:13px 6px}
  table.t td:first-child{white-space:normal;overflow-wrap:anywhere}

  const age = ageOfNewest(), m = cur.text;
  txt($("#meta-live"), LIVE.lost ? `No answer from the server since ${tHMS(LIVE.answered)}.` : `Live. The newest sample is ${span(age)} old.`);
  txt($("#whenago"), m.kind === "now" ? `${tFull(NOW.t)} · sampled ${span(age)} ago` : `${span(NOW.t - m.t)} before ${LIVE.stale ? "the last sample" : "now"}`);
  const viewing = $("#viewing");
  viewing.hidden = m.kind === "now";
  if (m.kind !== "now") txt(viewing, fillWords(WORDS.viewing, { when: sameDay(m.t, NOW.t) ? tHM(m.t) : tFull(m.t), ago: span(Math.max(0, NOW.t - m.t)) }));
  $("#stale").hidden = !LIVE.stale;
  if (LIVE.stale) txt($("#stale-t"), LIVE.lost
    ? `The server has not answered since ${tHMS(LIVE.answered)}. What you see is the last sample it gave, ${span(age)} old. The page keeps asking.`
    : `The newest sample is ${span(age)} old. The server answers, but the monitor has recorded nothing since ${tHMS(NOW.t)}.`);
}
function everySecond() {
  if (!LIVE.ready) return;
  if (isStale() !== LIVE.stale) { LIVE.stale = !LIVE.stale; render(true); } else paintAge();
}

/* One round: the newest sample first, and the longer parts only when there is one and they are due. */
async function cycle() {
  /* Hidden, the page asks nothing, but for its first picture: a tab opened in the background shows the machine the
     moment it comes to the front, and not a page that is still reading. */
  if (LIVE.busy || (document.hidden && LIVE.ready)) return;
  LIVE.busy = true;
  const get = (p) => fetch(`/api/monitor/page/${p.path}`, { cache: "no-store", signal: AbortSignal.timeout(8000) }).then((res) => (res.ok ? res.text() : null)).catch(() => null);
  const parse = (text) => { try { return text == null ? null : JSON.parse(text); } catch (e) { return null; } };
  const at = Date.now(), [newest, ...longer] = PARTS;
  const said = await get(newest), head = parse(said);
  if (!head) { LIVE.lost = true; if (LIVE.ready) everySecond(); else gate("lost"); }
  else {
    LIVE.lost = false; LIVE.answered = Date.now();
    if (head.on === false || head.waiting) gate(head.waiting ? "waiting" : "off", head.failed);
    else {
      LIVE.offset = Date.now() - head.asOf;
      LIVE.parsed.now = head;
      const changed = new Set([...(LIVE.waiting || []), "now"]);
      const due = longer.filter((p) => !(LIVE.asked[p.key] > at - p.every + 2000)), got = await Promise.all(due.map(get));
      due.forEach((p, i) => {
        const d = got[i] === LIVE.raw[p.key] ? null : parse(got[i]);
        if (got[i] != null) LIVE.asked[p.key] = at;
        if (d && d.on !== false) { LIVE.raw[p.key] = got[i]; LIVE.parsed[p.key] = d; changed.add(p.key); }
      });
      if (PARTS.every((p) => LIVE.parsed[p.key])) { if (LIVE.dragging()) LIVE.waiting = changed; else apply(changed); }
    }
  }
  LIVE.busy = false;
  /* The next question comes a moment after the server's next tick. */
  const tick = (DATA.tickSeconds || 10) * 1000;
  clearTimeout(LIVE.timer);
  if (!document.hidden) LIVE.timer = setTimeout(cycle, tick - (Date.now() - LIVE.offset) % tick + 1500);
}
function wake() {
  clearTimeout(LIVE.timer); clearInterval(LIVE.ager);
  if (document.hidden) { if (LIVE.ready) stopPlay(); else cycle(); return; }
  LIVE.ager = setInterval(everySecond, 1000);
  cycle();
}
document.addEventListener("visibilitychange", wake);

let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (LIVE.ready && (!G || stage.clientWidth !== G.w || stage.clientHeight !== G.h || (TL && plot.clientWidth !== TL.W))) relayout(); }); }).observe($("#app"));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { meas.reset(); for (const id in tiles) tiles[id].sig = ""; if (LIVE.ready) relayout(); });
gate("loading");
wake();
})();
</script>
